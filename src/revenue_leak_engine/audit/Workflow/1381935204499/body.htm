							<script type="text/javascript" language="javascript">
function Validate()
{
	clearErrorMsg();
	preValidate();

	g_NewPasswordInput = document.getElementById("password");
	g_confirmNewPasswordInput = document.getElementById("passwordConf");
	g_NewEmailInput = document.getElementById("username");
	g_confirmNewEmailInput = document.getElementById("usernameConf");
	var success = true;
	var errors = "";

	//validate email address and password
	if( !CheckCred('e',g_NewEmailInput.value)) {
		success = false;
		errors += "Please enter a valid email address\n";
	}
	if( !CheckCred('p',g_NewPasswordInput.value)) {
		success = false;
		errors += "Please enter a password between 6 to 32 characters\n";
	}
	
	//make sure email address matches confirmation of email address and same for password
	if(g_confirmNewEmailInput.value != g_NewEmailInput.value) {					
		success = false;
		errors += "Your email address does not match the confirmation address\n";
	}
	if(g_confirmNewPasswordInput.value != g_NewPasswordInput.value) {					
		success = false;
		errors += "Your password does not match the confirmation password\n";
	}
	
	if(success == true) {
		CreateAccount();
	}
    else {
		processerror(errors);
	}
}
</script>
