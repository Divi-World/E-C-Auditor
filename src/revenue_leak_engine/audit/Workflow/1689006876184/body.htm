<script type="text/javascript" language="javascript">
//listen for changes to worklow buttons
var eventMethod,messageEvent;
if (window.addEventListener) {
   eventMethod = "addEventListener";
   messageEvent = "message";
}
else {
   eventMethod = "attachEvent";
   messageEvent = eventMethod == "attachEvent" ? "onmessage" : "message";
}
var eventer = window[eventMethod];
eventer(messageEvent, function (e) {
	if (e.data != null){
		showbtn(e.data);
	}
}, false);

/** FOR TESTING ONLY: toggle whether you load sign in content from ipm.corel.com DEV, STG or PROD **/
/** based on value/existence of HKEY_LOCAL_MACHINE\SOFTWARE\Corel\autuni_env **/
var envflag = 'prod';
function checkenv() {
	location.href = "pcucmd://validate?param=/registry/regkey[@name='hklm/software/corel']/regval[@name='autuni_env'][@value='dev']";
	location.href = "pcucmd://CallScriptFunc?condition=true&funcname=devorstg&param=dev";
	location.href = "pcucmd://CallScriptFunc?condition=false&funcname=devorstg&param=stg";
}
function devorstg(env) {
	envflag = env;
}
/** END FOR TESTING ONLY **/
	
function onpageload()
{
	//check to see if we need to add Skip button (when NLR regtype is optional)
	location.href = "pcucmd://validate?param=/productmanifest/licenseinfolist/licenseinfo[(@licenseid='540227504' or @licenseid='540227267' or @licenseid='540111182' or @licenseid='540111146' or @licenseid='540111144') and @regtype='0']";
	location.href = "pcucmd://CallScriptFunc?condition=true&funcname=showbtn&param=skipbtnhtml";

	//get language param value
	var langcode = getParamVal("Lang");
	if (langcode == '') {
		langcode = 'en';
	}
	langcode = langcode.toLowerCase();

	/** FOR TESTING ONLY **/
	//if reg string exists its not PROD so check for DEV vs STG, if reg string does not exist its PROD
	location.href = "pcucmd://validate?param=/registry/regkey[@name='hklm/software/corel']/regval[@name='autuni_env']";
	location.href = "pcucmd://CallScriptFunc?condition=true&funcname=checkenv";
	//base iframe URL
	var iframeURL = 'https://ipm.corel.com/cdgs/2024/ipmsignin_';
	switch(envflag) {
	  case 'dev':
		iframeURL = 'https://dev.ipm.corel.public.corel.net/cdgs/2024/ipmsignin_';
		break;
	  case 'stg':
		iframeURL = 'https://stg.ipm.corel.public.corel.net/cdgs/2024/ipmsignin_';
		break;
	  default:
		iframeURL = 'https://ipm.corel.com/cdgs/2024/ipmsignin_';
	}
	/** END FOR TESTING ONLY **/

	//construct iframe src URL
	iframeURL += langcode + '.html' + location.search.substring(0);
	//iframeURL = addGoogleAnalyticsParamsToUrl(iframeURL);

	//append the iframe src URL
	document.getElementById('msgiframe').src = iframeURL;
	location = 'pcucmd://FrameDataLoaded';
}
//add/replace workflow button(s) dynamically (Skip, Cancel/Back, Back/Cancel)
function showbtn(btntype)
{
	//get HTML of new button to be added
	var newbtnhtml = document.getElementById(btntype).innerHTML;
	if (newbtnhtml != null && newbtnhtml != '')
	{
		//button bar container div
		var btnbarcont = parent.document.getElementById('ButtonBar').children[0];
		if (btnbarcont != null && btnbarcont != '')
		{
			var buttonel;
			//add new button cell and html (Skip button)
			if (btntype == 'skipbtnhtml')
			{
				//children[1] because Skip button goes on bottom right side of dialog (will return one row)
				var newbtnrow = btnbarcont.children[1].getElementsByTagName('TR')[0];
				if (newbtnrow != null && newbtnrow != '') {
					buttonel = newbtnrow.insertCell(0);
					buttonel.innerHTML = newbtnhtml;
				}
			}
			//replace existing button html
			else
			{
				//collection of all existing workflow buttons (each has its own cell with button element inside)
				buttonel = btnbarcont.getElementsByTagName('TD');
				for (let i = 0; i < buttonel.length; i++)
				{
					//if changing cancel button to back button
					if (btntype == 'backbtnhtml')
					{
						if(buttonel[i].firstChild.id == 'pcubtncancel') {
							buttonel[i].innerHTML = newbtnhtml;
						}
					}
					//if changing back button to cancel button
					else if (btntype == 'cancelbtnhtml')
					{
						if(buttonel[i].firstChild.id == 'pcubtnback') {
							buttonel[i].innerHTML = newbtnhtml;
						}
					}
				}
			}
		}
	}
}
</script>
