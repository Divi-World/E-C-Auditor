        function onpageload() {

            location = 'pcucmd://FrameDataLoaded';

            var country = getParamVal("country");
            if (country) {
                var temp = country.toUpperCase();

                if (temp != 'US') {
                    var selectobject = document.getElementById("countrySelector");
                    for (var i = 0; i < selectobject.length; i++) {
                        if (selectobject.options[i].value == temp) {

                        }
                    }
                }
            }

            showCreateAccount();

        }

        function showCreateAccount() {
            
            var bShow = true;

            var lupid = getParamVal("lupid");
            var profileid = getParamVal("profileid");
            var serialtype = getParamVal("serialtype");
            var lastUser = getParamVal("lusr");

            if (serialtype == '15' || serialtype == '0' ||
                lupid.length > 0 ||
                profileid.length > 0 ||
                lastUser.length > 0) {

                bShow = false;
            }

            var pEl = null;
            pEl = document.getElementById('idCreateAccount');
            if (pEl == null) {
                return;
            }

            if (!bShow) {
                pEl.style.display = "none";

                if ("" != lastUser) {
                    var username_obj = document.getElementById("ExistingEmail");
                    username_obj.style.background = '#fcfcfc';
                    username_obj.value = lastUser;
                }

                pEl = document.getElementById("idSignIn");
                if (pEl != null) {
                    pEl.style.marginLeft = 0;
                }
            }
            else {
                pEl.style.display = "block";
            }

        }

        function processerror(strError) {
            g_bError = true;

            var nIndex = strError.indexOf("|");
            var strErrorDesc = strError;
            var strErrorcode;
            if (nIndex >= 0) {
                strErrorDesc = strErrorDesc.substr(nIndex + 1);
                strErrorCode = strError.substr(0, nIndex);
            }

            error_msg.style.display = "block";
            error_msg.innerText = strErrorDesc;
        }

        function loginsuccess(str) {
            
            var created = extractParam(str, "created");
            var subid = extractParam(str, "SubscriptionID");
            var status = extractParam(str, "EmailStatus");
            var lusr = extractParam(str, "UserID");

            setCookie("lusr", lusr);
            location = "pcucmd://setcookie?lusr=" + lusr;

            if ('true' == created) {
                if ('4' == status) {
                    sendEmailValidation();
                }

                switch(subid)
                {
                case "1700090":
                case "1700087":
                case "1700093":
                    location = subid + ".html?created=<created>&SubscriptionID=<SubscriptionID>";
                    break;
                default:
                    location = "pcucmd://continue";
                }
            }
            else {
                location = "pcucmd://continue";
            }

        }

        function Authenticate(usr, psw) {
            
            g_bError = false;
            var str = "pcucmd://authenticate?username='" + usr + "'&password='" + psw + "'&showpsid=false" + "&closewindow=false" + "&onerror=processerror";
            location = str;

            if (!g_bError) {
                location = "pcucmd://replacetoken?callback='loginsuccess'&string='?created=<created>&SubscriptionID=<SubscriptionID>&EmailStatus=<EmailStatus>&UserID=<UserID>'";
            }
        }

        function logon() {
				Authenticate(document.getElementById("ExistingEmail").value, document.getElementById("ExistingPassword").value);
        }

        function CreateAccount() {
            var crit = document.getElementById("CritSWUpdateCheckbox");
            var custR = document.getElementById("CorelResearchCheckbox");
            var vFlag = 0;

            if (crit.checked) {
                vFlag = vFlag | 3;
            }

            if (custR.checked) {
                vFlag = vFlag | 16;
            }

            var Nickname = "";
            var Language = getParamVal("lang");
            g_bError = false;
            var str = "pcucmd://createAccount?username='" + g_NewEmailInput.value + "'&password='" + g_NewPasswordInput.value + "'&nickname='" + Nickname + "'&langcode='" + Language + "'&countrycode='" + document.getElementById("countrySelector").value + "'&flags='" + vFlag + "'&onerror=processerror";
            location = str;
				
            if (!g_bError) {
                Authenticate(g_NewEmailInput.value, g_NewPasswordInput.value);
            }
        }


        function clearErrorMsg() {
            error_msg.style.display = "none";
            error_msg.innerText = "";
            g_bError = false;
        }

        function CheckPassword(input) {
            var password = /^[A-Za-z0-9!@&$%#~]{6,32}$/;
            if (password.test(input)) {
                return true;
            }
            else {
                return false;
            }
        }

        function preValidate() {

            var pEl = document.getElementById("username");
            if (pEl) {
                pEl.value = pEl.value.toString().toLowerCase();
            }
            var pEl = document.getElementById("usernameConf");
            if (pEl) {
                pEl.value = pEl.value.toString().toLowerCase();
            }

        }

        function Validate() {
            clearErrorMsg();
            preValidate();

            g_confirmNewPasswordInput = document.getElementById("passwordConf");
            g_NewEmailInput = document.getElementById("username");
            g_confirmNewEmailInput = document.getElementById("usernameConf");
            var success = true;
            var errors = "";

            if (g_NewEmailInput.value != g_confirmNewEmailInput.value) {
                success = false;
                errors += "Your email address does not match the confirmation address\n";
            }

            if (!CheckPassword(g_NewPasswordInput.value)) {
                success = false;
                errors += "Please enter a password between 6 to 32 characters\n";
            }

            if (!CheckPassword(g_confirmNewPasswordInput.value)) {
                success = false;
                errors += "Please enter a confirmation password between 6 to 32 characters\n";
            }

            if (g_NewPasswordInput.value != g_confirmNewPasswordInput.value) {
                success = false;
                errors += "Your password does not match the confirmation password\n";
            }

            if (success == true) {
                CreateAccount();
            }
            else {
                processerror(errors);
            }

        }
