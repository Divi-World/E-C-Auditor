[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revenue-leak-engine"
version = "0.2.0"
description = "Shopify revenue-leak audit and client acquisition engine"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "playwright>=1.44.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-mock>=3.12.0"]

[project.scripts]
rle-pipeline = "revenue_leak_engine.pipeline:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"revenue_leak_engine.reporting" = ["templates/*.html"]
